<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: #fffaf2;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #d97706;
        --border: #e5d5bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, #fde7c7 0%, transparent 35%),
          linear-gradient(135deg, var(--bg), #efe4d4);
        color: var(--text);
      }

      main {
        width: min(680px, 100%);
        padding: 48px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: rgba(255, 250, 242, 0.92);
        box-shadow: 0 24px 80px rgba(84, 54, 20, 0.12);
      }

      .code {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 5rem;
        line-height: 1;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0 0 16px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--text);
        color: #fffaf2;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        background: #111827;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>That page wandered off.</h1>
      <p>The page you requested does not exist on this server.</p>
      <p>If you were trying to reach the API, double-check the route path and HTTP method.</p>
      <a href="/api/v1">Go Home</a>
    </main>
  </body>
</html>
